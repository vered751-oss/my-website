<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>סורק מתכונים מתמונות</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      color: var(--primary);
    }

    .api-key-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
    }

    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
    }

    .upload-area {
      border: 2px dashed var(--primary);
      border-radius: 12px;
      padding: 30px;
      text-align: center;
      cursor: pointer;
      background: #f0f3ff;
      transition: background 0.2s;
    }

    .upload-area:hover {
      background: #e5ebff;
    }

    #preview {
      max-width: 100%;
      max-height: 250px;
      border-radius: 8px;
      margin-top: 15px;
      display: none;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }

    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }

    .loader {
      display: none;
      text-align: center;
      margin: 20px 0;
      font-weight: 600;
    }

    .recipe-card {
      display: none;
      margin-top: 25px;
      border-top: 2px solid var(--border);
      padding-top: 20px;
    }

    .meta-info {
      display: flex;
      gap: 15px;
      background: #f1f5f9;
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 15px;
    }

    ul, ol {
      padding-right: 20px;
      line-height: 1.6;
    }

    li { margin-bottom: 8px; }
  </style>
</head>
<body>

<div class="container">
  <h1>📷 סורק מתכונים AI</h1>

  <div class="api-key-group">
    <label for="apiKey">מפתח Gemini API:</label>
    <input type="password" id="apiKey" placeholder="הדבק כאן את מפתח ה-API שלך">
  </div>

  <div class="upload-area" onclick="document.getElementById('fileInput').click()">
    <div> לחץ לבחירת תמונה / צילום מסך או צלם במצלמה</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment" style="display:none">
    <img id="preview" alt="תצוגה מקדימה">
  </div>

  <button id="processBtn" disabled>חלוץ מתכון מהתמונה</button>

  <div id="loader" class="loader">מפענח את המתכון... ⏳</div>

  <div id="recipeResult" class="recipe-card">
    <h2 id="recipeTitle"></h2>
    <div class="meta-info">
      <span>⏱️ הכנה: <strong id="prepTime"></strong></span>
      <span>🔥 בישול: <strong id="cookTime"></strong></span>
      <span>🍽️ מנות: <strong id="servings"></strong></span>
    </div>

    <h3>מצרכים:</h3>
    <ul id="ingredientsList"></ul>

    <h3>הוראות הכנה:</h3>
    <ol id="instructionsList"></ol>
  </div>
</div>

<script>
  const fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview');
  const processBtn = document.getElementById('processBtn');
  const apiKeyInput = document.getElementById('apiKey');
  const loader = document.getElementById('loader');
  const recipeResult = document.getElementById('recipeResult');

  let base64Image = "";
  let mimeType = "";

  // טעינת מפתח שמור בלוקל סטורג'
  apiKeyInput.value = localStorage.getItem('gemini_api_key') || '';
  apiKeyInput.addEventListener('input', () => {
    localStorage.setItem('gemini_api_key', apiKeyInput.value.trim());
  });

  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) {
      mimeType = file.type;
      const reader = new FileReader();
      reader.onload = (event) => {
        base64Image = event.target.result.split(',')[1];
        preview.src = event.target.result;
        preview.style.display = 'block';
        processBtn.disabled = false;
      };
      reader.readAsDataURL(file);
    }
  });

  processBtn.addEventListener('click', async () => {
    const apiKey = apiKeyInput.value.trim();
    if (!apiKey) {
      alert('נא להזין מפתח API של Gemini');
      return;
    }

    loader.style.display = 'block';
    recipeResult.style.display = 'none';
    processBtn.disabled = true;

    const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

    const prompt = `
      נתח את תמונת המתכון והחזר תשובה בפורמט JSON בלבד.
      המבנה הנדרש:
      {
        "title": "שם המתכון",
        "prep_time": "זמן הכנה",
        "cook_time": "זמן אפייה/בישול",
        "servings": "כמות מנות",
        "ingredients": ["מצרך 1", "מצרך 2"],
        "instructions": ["שלב 1", "שלב 2"]
      }
    `;

    const requestBody = {
      contents: [{
        parts: [
          { text: prompt },
          { inline_data: { mime_type: mimeType, data: base64Image } }
        ]
      }],
      generationConfig: {
        response_mime_type: "application/json"
      }
    };

    try {
      const response = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(requestBody)
      });

      const data = await response.json();
      
      if (data.error) {
        throw new Error(data.error.message);
      }

      const recipeText = data.candidates[0].content.parts[0].text;
      const recipe = JSON.parse(recipeText);

      renderRecipe(recipe);
    } catch (err) {
      alert('שגיאה בפענוח התמונה: ' + err.message);
    } finally {
      loader.style.display = 'none';
      processBtn.disabled = false;
    }
  });

  function renderRecipe(data) {
    document.getElementById('recipeTitle').textContent = data.title || 'מתכון ללא שם';
    document.getElementById('prepTime').textContent = data.prep_time || '-';
    document.getElementById('cookTime').textContent = data.cook_time || '-';
    document.getElementById('servings').textContent = data.servings || '-';

    const ingredientsList = document.getElementById('ingredientsList');
    ingredientsList.innerHTML = '';
    (data.ingredients || []).forEach(item => {
      const li = document.createElement('li');
      li.textContent = item;
      ingredientsList.appendChild(li);
    });

    const instructionsList = document.getElementById('instructionsList');
    instructionsList.innerHTML = '';
    (data.instructions || []).forEach(step => {
      const li = document.createElement('li');
      li.textContent = step;
      instructionsList.appendChild(li);
    });

    recipeResult.style.display = 'block';
  }
</script>

</body>
</html>

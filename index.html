<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים האישי שלי</title>
    <!-- פונט Google Assistant לקריאות מיטבית בעברית -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f0f9ff;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #bae6fd;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --shadow-sm: 0 2px 4px rgba(2, 132, 199, 0.05);
            --shadow-md: 0 4px 15px rgba(2, 132, 199, 0.08);
            --shadow-lg: 0 10px 25px rgba(2, 132, 199, 0.15);
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Buttons */
        .btn {
            border: none;
            outline: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: white;
            color: var(--primary);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover, .btn-outline.active {
            background-color: var(--primary-light);
            border-color: var(--primary);
        }

        .btn-danger-outline {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-danger-outline:hover {
            background-color: #fee2e2;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* Controls Section */
        .controls-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid #e0f2fe;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-color: #f8fafc;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        /* Grid Layout */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Recipe Card */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid #e0f2fe;
            box-shadow: var(--shadow-md);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }

        .badges-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-category {
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        .badge-diff-קל {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-diff-בינוני {
            background-color: #ffedd5;
            color: #c2410c;
        }

        .badge-diff-קשה {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            line-height: 1.3;
        }

        .card-body {
            margin-bottom: 1.25rem;
            flex-grow: 1;
        }

        .instructions-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
            max-height: 150px;
            overflow-y: auto;
            padding-left: 0.25rem;
        }

        .link-btn {
            width: 100%;
            margin-top: 0.5rem;
            text-align: center;
        }

        .card-footer {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid #f1f5f9;
            padding-top: 0.75rem;
        }

        .card-footer .btn {
            flex: 1;
            padding: 0.4rem;
            font-size: 0.85rem;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        /* Modal styling */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            padding: 1rem;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: white;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.2s ease-in-out;
        }

        .modal-backdrop.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.75rem;
        }

        .modal-header h3 {
            font-size: 1.25rem;
            color: var(--primary-dark);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-muted);
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.65rem 0.8rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            background-color: white;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: space-between;
            }
            .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo" id="logo-btn">
                📖 <span>ספר המתכונים שלי</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" id="home-btn">🏠 דף הבית</button>
                <button class="btn btn-primary" id="add-recipe-btn">➕ מתכון חדש</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Search & Filter Controls -->
        <section class="controls-card">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 חפש לפי שם מתכון או קטגוריה (אפייה, קינוח...)...">
            </div>
            <div class="filter-buttons">
                <button class="btn btn-outline active" id="filter-all">הצג הכל</button>
                <button class="btn btn-outline" id="filter-favs">❤️ מועדפים</button>
            </div>
        </section>

        <!-- Recipes Grid Container -->
        <section id="recipes-grid" class="recipes-grid"></section>
    </main>

    <!-- Footer -->
    <footer>
        ספר המתכונים האישי שלי &copy; כל הזכויות שמורות
    </footer>

    <!-- Recipe Modal (Add/Edit) -->
    <div class="modal-backdrop" id="recipe-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">מתכון חדש</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="recipe-form">
                <input type="hidden" id="recipe-id">
                
                <div class="form-group">
                    <label for="recipe-title">שם המתכון</label>
                    <input type="text" id="recipe-title" required placeholder="לדוגמה: עוגת שוקולד חמה">
                </div>

                <div class="form-group">
                    <label for="recipe-category">סוג (קטגוריה)</label>
                    <input type="text" id="recipe-category" required list="category-options" placeholder="לדוגמה: קינוח, אפייה, מנה עיקרית...">
                    <datalist id="category-options">
                        <option value="אפייה"></option>
                        <option value="קינוח"></option>
                        <option value="מנה עיקרית"></option>
                        <option value="בישול"></option>
                        <option value="תוספת"></option>
                        <option value="מרק"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="recipe-difficulty">דרגת קושי</label>
                    <select id="recipe-difficulty" required>
                        <option value="קל">קל</option>
                        <option value="בינוני">בינוני</option>
                        <option value="קשה">קשה</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recipe-content">רכיבים והוראות / קישור למתכון</label>
                    <textarea id="recipe-content" rows="4" required placeholder="הזן קישור (http/https) או כתוב את הרכיבים והוראות ההכנה..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancel-modal">ביטול</button>
                    <button type="submit" class="btn btn-primary">שמירה</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // Initial Default Recipes Data
        const defaultRecipes = [
            {
                "id": "1",
                "title": "אוזני המן קלאסיות במילוי נוטלה",
                "category": "קינוח",
                "difficulty": "בינוני",
                "linkOrInstructions": "https://foody.co.il/foody_recipe/%d7%90%d7%95%d7%96%d7%a0%d7%99-%d7%94%d7%9e%d7%9f-%d7%a7%d7%a1%d7%99%d7%95%d7%aa-%d7%91%d7%9e%d7%99%d7%9c%d7%95%d7%99-%d7%a0%d7%95%d7%98%d7%9c%d7%94/",
                "favorite": false
            },
            {
                "id": "2",
                "title": "פררו רושה ביתי",
                "category": "קינוח",
                "difficulty": "קל",
                "linkOrInstructions": "https://www.mako.co.il/food-cooking_magazine/SOS/Recipe-bd7cfae0b015f61026.htm",
                "favorite": false
            },
            {
                "id": "3",
                "title": "ממתק שוקולד ופקאן",
                "category": "קינוח",
                "difficulty": "קל",
                "linkOrInstructions": "https://www.10dakot.co.il/recipe/%D7%9E%D7%9E%D7%AA%D7%A7-%D7%A9%D7%95%D7%A7%D7%95%D7%9C%D7%93-%D7%95%D7%A4%D7%A7%D7%A0%D7%9F/",
                "favorite": false
            },
            {
                "id": "4",
                "title": "בואיקוס (לחמניות גבינה)",
                "category": "אפייה",
                "difficulty": "קל",
                "linkOrInstructions": "https://www.hashulchan.co.il/%D7%9E%D7%AA%D7%A7%D7%95%D7%A0%D7%99%D7%9D/%D7%91%D7%95%D7%90%D7%99%D7%A7%D7%95%D7%A1/",
                "favorite": false
            },
            {
                "id": "5",
                "title": "פיש אנד צ'יפס דניס",
                "category": "מנה עיקרית",
                "difficulty": "בינוני",
                "linkOrInstructions": "https://www.hashulchan.co.il/%D7%9E%D7%AA%D7%A7%D7%95%D7%A0%D7%99%D7%9D/%D7%A4%D7%99%D7%A9-%D7%A6%D7%99%D7%A4%D7%A1/",
                "favorite": false
            }
        ];

        // State Management
        let recipes = [];
        let currentFilter = 'all'; // 'all' or 'favs'
        let searchQuery = '';

        // DOM Elements
        const gridEl = document.getElementById('recipes-grid');
        const searchInput = document.getElementById('search-input');
        const filterAllBtn = document.getElementById('filter-all');
        const filterFavsBtn = document.getElementById('filter-favs');
        const homeBtn = document.getElementById('home-btn');
        const logoBtn = document.getElementById('logo-btn');
        const addRecipeBtn = document.getElementById('add-recipe-btn');
        
        // Modal Elements
        const modal = document.getElementById('recipe-modal');
        const modalTitle = document.getElementById('modal-title');
        const closeModalBtn = document.getElementById('close-modal');
        const cancelModalBtn = document.getElementById('cancel-modal');
        const recipeForm = document.getElementById('recipe-form');
        const recipeIdInput = document.getElementById('recipe-id');
        const recipeTitleInput = document.getElementById('recipe-title');
        const recipeCategoryInput = document.getElementById('recipe-category');
        const recipeDifficultyInput = document.getElementById('recipe-difficulty');
        const recipeContentInput = document.getElementById('recipe-content');

        // Initialization
        function init() {
            loadRecipes();
            setupEventListeners();
            render();
        }

        // LocalStorage Logic
        function loadRecipes() {
            const stored = localStorage.getItem('my_recipes_data');
            if (stored) {
                try {
                    recipes = JSON.parse(stored);
                } catch (e) {
                    recipes = defaultRecipes;
                }
            } else {
                recipes = defaultRecipes;
                saveRecipes();
            }
        }

        function saveRecipes() {
            localStorage.setItem('my_recipes_data', JSON.stringify(recipes));
        }

        // Utility: Check if string is URL
        function isURL(str) {
            return str.trim().startsWith('http://') || str.trim().startsWith('https://');
        }

        // Render Function
        function render() {
            gridEl.innerHTML = '';

            const filtered = recipes.filter(recipe => {
                const matchesFilter = currentFilter === 'all' || recipe.favorite;
                const query = searchQuery.toLowerCase().trim();
                const matchesSearch = recipe.title.toLowerCase().includes(query) || 
                                      recipe.category.toLowerCase().includes(query);
                return matchesFilter && matchesSearch;
            });

            if (filtered.length === 0) {
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <h3>לא נמצאו מתכונים</h3>
                        <p>נסה לשנות את מונחי החיפוש או הוסיף מתכון חדש.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(recipe => {
                const card = document.createElement('article');
                card.className = 'card';

                const isLink = isURL(recipe.linkOrInstructions);
                
                const bodyContent = isLink ? 
                    `<a href="${recipe.linkOrInstructions}" target="_blank" class="btn btn-primary link-btn">🔗 לצפייה במתכון המלא</a>` : 
                    `<p class="instructions-text">${recipe.linkOrInstructions}</p>`;

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <div class="badges-group">
                                <span class="badge badge-category">${recipe.category}</span>
                                <span class="badge badge-diff-${recipe.difficulty}">${recipe.difficulty}</span>
                            </div>
                            <button class="fav-btn" onclick="toggleFavorite('${recipe.id}')" title="מועדפים">
                                ${recipe.favorite ? '❤️' : '🤍'}
                            </button>
                        </div>
                        <h2 class="card-title">${recipe.title}</h2>
                        <div class="card-body">
                            ${bodyContent}
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline" onclick="openEditModal('${recipe.id}')">✏️ עריכה</button>
                        <button class="btn btn-danger-outline" onclick="deleteRecipe('${recipe.id}')">🗑️ מחיקה</button>
                    </div>
                `;

                gridEl.appendChild(card);
            });
        }

        // Event Handlers & Actions
        function setupEventListeners() {
            // Search Input
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                render();
            });

            // Filters
            filterAllBtn.addEventListener('click', () => {
                currentFilter = 'all';
                filterAllBtn.classList.add('active');
                filterFavsBtn.classList.remove('active');
                render();
            });

            filterFavsBtn.addEventListener('click', () => {
                currentFilter = 'favs';
                filterFavsBtn.classList.add('active');
                filterAllBtn.classList.remove('active');
                render();
            });

            // Reset / Home Navigation
            const resetHome = () => {
                searchQuery = '';
                searchInput.value = '';
                currentFilter = 'all';
                filterAllBtn.classList.add('active');
                filterFavsBtn.classList.remove('active');
                render();
            };

            homeBtn.addEventListener('click', resetHome);
            logoBtn.addEventListener('click', resetHome);

            // Modal Controls
            addRecipeBtn.addEventListener('click', openAddModal);
            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            // Form Submit
            recipeForm.addEventListener('submit', handleFormSubmit);
        }

        function toggleFavorite(id) {
            recipes = recipes.map(r => r.id === id ? { ...r, favorite: !r.favorite } : r);
            saveRecipes();
            render();
        }

        function deleteRecipe(id) {
            if (confirm('האם אתה בטוח שברצונך למחוק מתכון זה?')) {
                recipes = recipes.filter(r => r.id !== id);
                saveRecipes();
                render();
            }
        }

        function openAddModal() {
            recipeForm.reset();
            recipeIdInput.value = '';
            modalTitle.textContent = 'הוספת מתכון חדש';
            modal.classList.add('active');
        }

        function openEditModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            recipeIdInput.value = recipe.id;
            recipeTitleInput.value = recipe.title;
            recipeCategoryInput.value = recipe.category;
            recipeDifficultyInput.value = recipe.difficulty;
            recipeContentInput.value = recipe.linkOrInstructions;

            modalTitle.textContent = 'עריכת מתכון';
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = recipeIdInput.value;
            const newRecipeData = {
                title: recipeTitleInput.value.trim(),
                category: recipeCategoryInput.value.trim(),
                difficulty: recipeDifficultyInput.value,
                linkOrInstructions: recipeContentInput.value.trim(),
            };

            if (id) {
                // Edit existing recipe
                recipes = recipes.map(r => r.id === id ? { ...r, ...newRecipeData } : r);
            } else {
                // Add new recipe
                const newRecipe = {
                    id: Date.now().toString(),
                    ...newRecipeData,
                    favorite: false
                };
                recipes.unshift(newRecipe);
            }

            saveRecipes();
            closeModal();
            render();
        }

        // Run App
        init();
    </script>
</body>
</html>

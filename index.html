<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים שלי</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Rubik', sans-serif; }
    </style>
</head>
<body class="bg-blue-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid to-blue-200 fa-utensils text-2xl text-blue-300"></i>
                <h1 class="text-2xl font-bold tracking-wide">ספר המתכונים שלי</h1>
            </div>
            <button onclick="openModal()" class="bg-blue-500 hover:bg-blue-600 text-white font-medium px-4 py-2 rounded-lg transition-all shadow flex items-center gap-2 text-sm md:text-base">
                <i class="fa-solid fa-plus"></i> הוספת מתכון חדש
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

        <!-- Controls Section -->
        <div class="bg-white rounded-xl shadow-md p-4 md:p-6 mb-6 border border-blue-100">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-4">
                
                <!-- Search -->
                <div class="relative w-full md:w-1/3">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-1/2 transform -translate-y-1/2 text-blue-400"></i>
                    <input type="text" id="searchInput" oninput="filterRecipes()" placeholder="חיפוש מתכון או רכיב..." 
                           class="w-full pr-10 pl-4 py-2 border border-blue-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                </div>

                <!-- Filters & Actions -->
                <div class="flex flex-wrap items-center gap-2 w-full md:w-auto justify-end">
                    <button id="favFilterBtn" onclick="toggleFavFilter()" class="px-4 py-2 rounded-lg border border-blue-300 text-blue-700 hover:bg-blue-50 transition flex items-center gap-2 text-sm font-medium">
                        <i class="fa-solid fa-heart text-red-500"></i> מועדפים בלבד
                    </button>
                    <button onclick="resetData()" title="שחזר מתכוני מקור" class="px-3 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-100 transition text-sm">
                        <i class="fa-solid fa-rotate-left"></i> איפוס
                    </button>
                </div>
            </div>

            <!-- Categories -->
            <div class="flex flex-wrap gap-2 pt-2 border-t border-blue-50" id="categoryTabs">
                <!-- Dynamic categories populated by JS -->
            </div>
        </div>

        <!-- Recipe Grid -->
        <div id="recipeGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards populated dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <i class="fa-solid fa-cookie-bite text-5xl text-blue-300 mb-3"></i>
            <p class="text-slate-500 text-lg">לא נמצאו מתכונים המתאימים לחיפוש.</p>
        </div>
    </main>

    <!-- Modal Form (Add/Edit) -->
    <div id="modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex justify-center items-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-xl max-h-[90vh] flex flex-col overflow-hidden border border-blue-100">
            <div class="bg-blue-600 text-white px-6 py-4 flex justify-between items-center">
                <h3 id="modalTitle" class="text-xl font-bold">הוספת מתכון חדש</h3>
                <button onclick="closeModal()" class="text-blue-100 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <form id="recipeForm" onsubmit="saveRecipe(event)" class="p-6 overflow-y-auto flex-grow space-y-4">
                <input type="hidden" id="recipeId">
                
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">שם המתכון *</label>
                    <input type="text" id="recipeName" required class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">סוג / קטגוריה *</label>
                        <select id="recipeType" required class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="אפייה">אפייה</option>
                            <option value="קינוח">קינוח</option>
                            <option value="מנה עיקרית">מנה עיקרית</option>
                            <option value="תוספת">תוספת</option>
                            <option value="מנה ראשונה">מנה ראשונה</option>
                            <option value="בישול">בישול</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">דרגת קושי *</label>
                        <select id="recipeDifficulty" required class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                            <option value="קל">קל</option>
                            <option value="בינוני">בינוני</option>
                            <option value="קשה">קשה</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">קישור חיצוני (URL לאתר/סרטון)</label>
                    <input type="url" id="recipeUrl" placeholder="https://..." class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">רכיבים והוראות הכנה</label>
                    <textarea id="recipeDetails" rows="5" class="w-full px-3 py-2 border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="פירוט רכיבים והוראות..."></textarea>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t border-slate-100">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-300 rounded-lg text-slate-600 hover:bg-slate-50">ביטול</button>
                    <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow">שמירה</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->

            { id: "16", name: "קינוח טריקולד מהיר", type: "קינוח", difficulty: "קל", url: "", details: "רכיבים: 500ג עוגיות שוקולד, 50ג חמאה, 2 כפות ליקר קפה. לקרם מריר/חלב/לבן: 1.5 מיכל שמנת מתוקה מוקצפת עם 100ג שוקולד מומס לכל שכבה.\nהוראות: טוחנים עוגיות, חמאה וליקר ומהדקים לתחתית. מקציפים שמנת עם כל שוקולד בנפרד, יוצרים שכבות ומקפיאים.", isFav: false },

            { id: "18", name: "רוזלך", type: "קינוח", difficulty: "בינוני", url: "https://www.haaretz.co.il/food/recipes/RECIPE-1.2898991", details: "", isFav: false },

            { id: "22", name: "פאי לימון", type: "קינוח", difficulty: "קשה", url: "", details: "רכיבים: בצק: 1.5 כוסות קמח, 1/2 כוס חמאה, 1/4 כוס סוכר, 2 חלמונים, גרידת לימון, 2 כפות מים. מילוי: 6 ביצים, 1 כוס סוכר, מיץ וגרידה מ4- לימונים, 180 מ\"ל שמנת מתוקה. מרנג: 6 חלבונים, סוכר.\nהוראות: מכינים בצק ומקררים שעה. אופים אפייה עיוורת (180 מעלות, 15 דק' עם משקולת + 15 דק' בלי). יוצקים מילוי, אופים ב120- מעלות, מכינים מרנג מעל ומשחימים.", isFav: false },

            { id: "53", name: "לחם שיפון וחיטה לבנה", type: "אפייה", difficulty: "בינוני", url: "", details: "רכיבים: 290 מ\"ל מים, 3 כפות שמן זית, 1 כפית חומץ, 1 כפית מלח, 200ג קמח שיפון מלא, 250ג קמח חיטה לבן, זרעי פשתן/צ'יה/אגוזים, 1.5 כפיות שמרים יבשים.\nהוראות: לשים את כל הרכיבים לבצק, מתפיחים, מעצבים כיכר ואופים בתנור.", isFav: false },
            { id: "54", name: "עוגת שוקולד ועוגיות של עדיקוש", type: "קינוח", difficulty: "בינוני", url: "https://www.mako.co.il/food-cooking_magazine/adikosh_sweet_recipes/Recipe-15c95f7dc541481026.htm", details: "", isFav: false }
        ];

        let recipes = JSON.parse(localStorage.getItem('myRecipes')) || initialRecipes;
        let selectedCategory = 'הכל';
        let showFavsOnly = false;

        function saveToStorage() {
            localStorage.setItem('myRecipes', JSON.stringify(recipes));
        }

        function resetData() {
            if (confirm("האם להחזיר את כל מתכוני המקור ולמחוק שינויים?")) {
                recipes = [...initialRecipes];
                saveToStorage();
                renderCategories();
                filterRecipes();
            }
        }

        function renderCategories() {
            const categories = ['הכל', ...new Set(recipes.map(r => r.type))];
            const container = document.getElementById('categoryTabs');
            container.innerHTML = categories.map(cat => `
                <button onclick="selectCategory('${cat}')" 
                        class="px-3 py-1.5 rounded-full text-xs font-semibold transition-all ${selectedCategory === cat ? 'bg-blue-600 text-white shadow' : 'bg-blue-100 text-blue-800 hover:bg-blue-200'}">
                    ${cat}
                </button>
            `).join('');
        }

        function selectCategory(cat) {
            selectedCategory = cat;
            renderCategories();
            filterRecipes();
        }

        function toggleFavFilter() {
            showFavsOnly = !showFavsOnly;
            const btn = document.getElementById('favFilterBtn');
            if (showFavsOnly) {
                btn.classList.add('bg-red-50', 'border-red-300', 'text-red-600');
            } else {
                btn.classList.remove('bg-red-50', 'border-red-300', 'text-red-600');
            }
            filterRecipes();
        }

        function toggleFav(id, event) {
            event.stopPropagation();
            const recipe = recipes.find(r => r.id === id);
            if (recipe) {
                recipe.isFav = !recipe.isFav;
                saveToStorage();
                filterRecipes();
            }
        }

        function deleteRecipe(id, event) {
            event.stopPropagation();
            if (confirm("האם למחוק את המתכון הזה?")) {
                recipes = recipes.filter(r => r.id !== id);
                saveToStorage();
                renderCategories();
                filterRecipes();
            }
        }

        function filterRecipes() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = recipes.filter(r => {
                const matchesCat = selectedCategory === 'הכל' || r.type === selectedCategory;
                const matchesSearch = r.name.toLowerCase().includes(searchVal) || (r.details && r.details.toLowerCase().includes(searchVal));
                const matchesFav = !showFavsOnly || r.isFav;
                return matchesCat && matchesSearch && matchesFav;
            });

            renderGrid(filtered);
        }

        function renderGrid(list) {
            const grid = document.getElementById('recipeGrid');
            const empty = document.getElementById('emptyState');

            if (list.length === 0) {
                grid.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.innerHTML = list.map(r => {
                const difficultyColor = r.difficulty === 'קל' ? 'bg-green-100 text-green-800' : r.difficulty === 'בינוני' ? 'bg-amber-100 text-amber-800' : 'bg-red-100 text-red-800';
                
                return `
                <div class="bg-white rounded-xl shadow-sm hover:shadow-md transition-shadow border border-blue-100 flex flex-col overflow-hidden relative group">
                    <div class="p-5 flex-grow">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <span class="text-xs px-2.5 py-1 rounded-full font-medium ${difficultyColor}">${r.difficulty}</span>
                            <span class="text-xs bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full font-medium">${r.type}</span>
                        </div>
                        <h3 class="text-lg font-bold text-slate-800 mb-2 leading-snug">${r.name}</h3>
                        
                        ${r.details ? `
                            <p class="text-xs text-slate-600 bg-blue-50/50 p-3 rounded-lg border border-blue-50 whitespace-pre-line leading-relaxed mb-3">
                                ${r.details}
                            </p>
                        ` : ''}

                        ${r.url ? `
                            <a href="${r.url}" target="_blank" class="inline-flex items-center gap-1.5 text-xs text-blue-600 hover:text-blue-800 font-medium underline mt-1">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> לצפייה במתכון המלא
                            </a>
                        ` : ''}
                    </div>

                    <!-- Footer / Actions -->
                    <div class="bg-slate-50 px-5 py-3 border-t border-slate-100 flex justify-between items-center text-slate-400">
                        <button onclick="toggleFav('${r.id}', event)" class="hover:text-red-500 transition">
                            <i class="${r.isFav ? 'fa-solid text-red-500' : 'fa-regular'} fa-heart text-lg"></i>
                        </button>
                        <div class="flex gap-2">
                            <button onclick="openModal('${r.id}')" class="text-slate-400 hover:text-blue-600 transition text-sm px-2 py-1">
                                <i class="fa-solid fa-pen-to-square"></i>
                            </button>
                            <button onclick="deleteRecipe('${r.id}', event)" class="text-slate-400 hover:text-red-600 transition text-sm px-2 py-1">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }

        function openModal(id = null) {
            const modal = document.getElementById('modal');
            const title = document.getElementById('modalTitle');
            
            if (id) {
                const r = recipes.find(item => item.id === id);
                title.innerText = "עריכת מתכון";
                document.getElementById('recipeId').value = r.id;
                document.getElementById('recipeName').value = r.name;
                document.getElementById('recipeType').value = r.type;
                document.getElementById('recipeDifficulty').value = r.difficulty;
                document.getElementById('recipeUrl').value = r.url || '';
                document.getElementById('recipeDetails').value = r.details || '';
            } else {
                title.innerText = "הוספת מתכון חדש";
                document.getElementById('recipeForm').reset();
                document.getElementById('recipeId').value = '';
            }

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        function saveRecipe(event) {
            event.preventDefault();
            const id = document.getElementById('recipeId').value;
            const name = document.getElementById('recipeName').value;
            const type = document.getElementById('recipeType').value;
            const difficulty = document.getElementById('recipeDifficulty').value;
            const url = document.getElementById('recipeUrl').value;
            const details = document.getElementById('recipeDetails').value;

            if (id) {
                const index = recipes.findIndex(r => r.id === id);
                if (index !== -1) {
                    recipes[index] = { ...recipes[index], name, type, difficulty, url, details };
                }
            } else {
                const newRecipe = {
                    id: Date.now().toString(),
                    name,
                    type,
                    difficulty,
                    url,
                    details,
                    isFav: false
                };
                recipes.unshift(newRecipe);
            }

            saveToStorage();
            renderCategories();
            filterRecipes();
            closeModal();
        }

        // Initialize App
        renderCategories();
        filterRecipes();
    </script>

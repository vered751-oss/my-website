<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים שלי</title>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --text-color: #2d3436;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Heebo', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #1e272e;
            margin-bottom: 12px;
        }

        .search-container {
            position: sticky;
            top: 10px;
            z-index: 100;
            background-color: var(--bg-color);
            padding-bottom: 10px;
        }

        .search-input {
            width: 100%;
            padding: 14px 18px;
            font-size: 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 25px;
            outline: none;
            transition: border-color 0.2s;
            box-shadow: var(--shadow);
        }

        .search-input:focus {
            border-color: var(--primary-color);
        }

        .filters {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 0 16px 0;
            scrollbar-width: none;
        }

        .filters::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: #edf2f7;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            white-space: nowrap;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        .filter-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .counter-badge {
            font-size: 0.9rem;
            color: #636e72;
            margin-bottom: 12px;
            text-align: right;
        }

        .recipes-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
        }

        /* התאמה למסכי מחשב וטאבלט */
        @media (min-width: 600px) {
            .recipes-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 900px) {
            .recipes-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .badge {
            background-color: #ffeaa7;
            color: #d63031;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: bold;
        }

        .card-details {
            font-size: 0.85rem;
            color: #636e72;
            margin-bottom: 16px;
            display: flex;
            gap: 12px;
        }

        .recipe-link {
            display: block;
            text-align: center;
            background-color: var(--secondary-color);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .recipe-link:hover {
            background-color: #3bcfc5;
        }
    </style>
</head>
<body>

    <header>
        <h1>📖 ספר המתכונים שלי</h1>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="חפש מתכון, רכיב או קטגוריה...">
    </div>

    <div class="filters" id="filtersContainer">
        <button class="filter-btn active" onclick="filterCategory('הכל')">הכל</button>
        <button class="filter-btn" onclick="filterCategory('עיקריות')">עיקריות</button>
        <button class="filter-btn" onclick="filterCategory('תוספות')">תוספות</button>
        <button class="filter-btn" onclick="filterCategory('קינוחים')">קינוחים</button>
        <button class="filter-btn" onclick="filterCategory('מאפים')">מאפים</button>
        <button class="filter-btn" onclick="filterCategory('מהיר')">מהיר להכנה</button>
    </div>

    <div class="counter-badge" id="counter">מציג 54 מתכונים</div>

    <div class="recipes-grid" id="recipesGrid"></div>

    <script>
        // מערך הנתונים הכולל את 54 המתכונים
        const recipesData = Array.from({ length: 54 }, (_, i) => {
            const categories = ['עיקריות', 'תוספות', 'קינוחים', 'מאפים', 'מהיר'];
            const category = categories[i % categories.length];
            const id = i + 1;
            return {
                id: id,
                title: `מתכון ${id}: ${getSampleTitle(id)}`,
                category: category,
                time: `${15 + (id % 6) * 10} דקות`,
                difficulty: id % 2 === 0 ? 'קל' : 'בינוני',
                link: `https://example.com/recipe/${id}` // החלף בקישור האמיתי שלך
            };
        });

        function getSampleTitle(id) {
            const titles = [
                'פסטה שמנת ופטריות', 'חזה עוף במרינדה', 'עוגת שוקולד חמה', 'אורז ירוק עם עשבי תיבול',
                'שקשוקה קלאסית', 'לזניה בשר', 'סלט קינואה וירקות', 'לחם מחמצת ביתי', 'פנקייק אוורירי',
                'מרק כתום עשיר', 'מוקפץ נודלס וירקות', 'קציצות בקר ברוטב'
            ];
            return titles[(id - 1) % titles.length];
        }

        let currentCategory = 'הכל';
        let searchQuery = '';

        function renderRecipes() {
            const grid = document.getElementById('recipesGrid');
            const counter = document.getElementById('counter');
            grid.innerHTML = '';

            const filtered = recipesData.filter(r => {
                const matchesCategory = currentCategory === 'הכל' || r.category === currentCategory;
                const matchesSearch = r.title.includes(searchQuery) || r.category.includes(searchQuery);
                return matchesCategory && matchesSearch;
            });

            counter.innerText = `מציג ${filtered.length} מתוך 54 מתכונים`;

            filtered.forEach(r => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <div class="card-title">${r.title}</div>
                            <span class="badge">${r.category}</span>
                        </div>
                        <div class="card-details">
                            <span>⏱️ ${r.time}</span>
                            <span>רמה: ${r.difficulty}</span>
                        </div>
                    </div>
                    <a href="${r.link}" target="_blank" class="recipe-link">לצפייה במתכון המלא ➔</a>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.toggle('active', btn.innerText === cat);
            });
            renderRecipes();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            searchQuery = e.target.value.trim();
            renderRecipes();
        });

        // טעינה ראשונית
        renderRecipes();
    </script>
</body>
</html>

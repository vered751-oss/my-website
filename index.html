<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ספר המתכונים האישי שלי</title>
    <!-- Google Fonts - Assistant -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #f0f9ff;
            --card-bg: #ffffff;
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #e0f2fe;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #bae6fd;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --shadow-sm: 0 2px 4px rgba(2, 132, 199, 0.05);
            --shadow-md: 0 4px 15px rgba(2, 132, 199, 0.08);
            --shadow-lg: 0 10px 25px rgba(2, 132, 199, 0.15);
            --radius-lg: 16px;
            --radius-md: 10px;
            --transition: all 0.25s ease-in-out;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Assistant', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background-color: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
            user-select: none;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        /* Buttons */
        .btn {
            border: none;
            outline: none;
            padding: 0.6rem 1.2rem;
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: var(--transition);
            text-decoration: none;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.3);
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
            transform: translateY(-1px);
        }

        .btn-outline {
            background-color: white;
            color: var(--primary-dark);
            border: 1px solid var(--border-color);
        }

        .btn-outline:hover, .btn-outline.active {
            background-color: var(--primary-light);
            border-color: var(--primary);
            color: var(--primary-dark);
        }

        .btn-danger-outline {
            background-color: transparent;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .btn-danger-outline:hover {
            background-color: #fee2e2;
        }

        /* Main Container */
        main {
            max-width: 1200px;
            margin: 1.5rem auto 3rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        /* Search & Filters Controls */
        .controls-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            margin-bottom: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid #e0f2fe;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
            background-color: #f8fafc;
        }

        .search-box input:focus {
            border-color: var(--primary);
            background-color: white;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .filter-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .stats-counter {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: -0.5rem;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        /* Grid Layout */
        .recipes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        /* Recipe Card */
        .card {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid #e0f2fe;
            box-shadow: var(--shadow-md);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: var(--transition);
            position: relative;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
            gap: 0.5rem;
        }

        .badges-group {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-weight: 600;
        }

        .badge-category {
            background-color: var(--primary-light);
            color: var(--primary-dark);
        }

        .badge-diff-קל {
            background-color: #dcfce7;
            color: #15803d;
        }

        .badge-diff-בינוני {
            background-color: #ffedd5;
            color: #c2410c;
        }

        .badge-diff-קשה {
            background-color: #fee2e2;
            color: #b91c1c;
        }

        .fav-btn {
            background: none;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.2s;
            line-height: 1;
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .card-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 0.75rem;
            line-height: 1.35;
        }

        .card-body {
            margin-bottom: 1.25rem;
            flex-grow: 1;
        }

        .instructions-text {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
            display: -webkit-box;
            -webkit-line-clamp: 5;
            -webkit-box-orient: vertical;
            overflow: hidden;
            background: #f8fafc;
            padding: 0.75rem;
            border-radius: var(--radius-md);
            border: 1px solid #f1f5f9;
        }

        .view-more-btn {
            background: none;
            border: none;
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 0.4rem;
            padding: 0;
            display: inline-block;
        }

        .view-more-btn:hover {
            text-decoration: underline;
        }

        .link-btn {
            width: 100%;
            margin-top: 0.5rem;
            text-align: center;
            font-size: 0.95rem;
        }

        .card-footer {
            display: flex;
            gap: 0.5rem;
            border-top: 1px solid #f1f5f9;
            padding-top: 0.75rem;
        }

        .card-footer .btn {
            flex: 1;
            padding: 0.45rem;
            font-size: 0.85rem;
        }

        /* Empty State */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 4rem 1rem;
            background: white;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .empty-state p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-top: 0.5rem;
        }

        /* Modal styling */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.45);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease-in-out;
            padding: 1rem;
        }

        .modal-backdrop.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: white;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 550px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            transform: translateY(20px);
            transition: transform 0.2s ease-in-out;
        }

        .modal-backdrop.active .modal {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            border-bottom: 1px solid #f1f5f9;
            padding-bottom: 0.75rem;
        }

        .modal-header h3 {
            font-size: 1.3rem;
            color: var(--primary-dark);
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.6rem;
            cursor: pointer;
            color: var(--text-muted);
            line-height: 1;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.35rem;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.7rem 0.85rem;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .view-modal-content {
            white-space: pre-line;
            line-height: 1.6;
            color: var(--text-main);
            background: #f8fafc;
            padding: 1rem;
            border-radius: var(--radius-md);
            border: 1px solid #e2e8f0;
            margin-top: 1rem;
            font-size: 1rem;
            max-height: 60vh;
            overflow-y: auto;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
            background-color: white;
        }

        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions {
                justify-content: space-between;
            }
            .btn {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-container">
            <div class="logo" id="logo-btn">
                📖 <span>ספר המתכונים שלי</span>
            </div>
            <div class="header-actions">
                <button class="btn btn-outline" id="home-btn">🏠 דף הבית</button>
                <button class="btn btn-primary" id="add-recipe-btn">➕ מתכון חדש</button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main>
        <!-- Search & Filter Controls -->
        <section class="controls-card">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="🔍 חפש מתכון לפי שם או קטגוריה (אפייה, קינוח, מנה עיקרית...)...">
            </div>
            <div class="filter-buttons" id="filter-container">
                <button class="btn btn-outline active" id="filter-all" data-category="all">הצג הכל</button>
                <button class="btn btn-outline" id="filter-favs" data-category="favs">❤️ מועדפים</button>
            </div>
        </section>

        <!-- Stats Counter -->
        <div class="stats-counter" id="stats-counter"></div>

        <!-- Recipes Grid Container -->
        <section id="recipes-grid" class="recipes-grid"></section>
    </main>

    <!-- Footer -->
    <footer>
        ספר המתכונים האישי שלי &copy; כל הזכויות שמורות
    </footer>

    <!-- Recipe Modal (Add / Edit) -->
    <div class="modal-backdrop" id="recipe-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">מתכון חדש</h3>
                <button class="close-btn" id="close-modal">&times;</button>
            </div>
            <form id="recipe-form">
                <input type="hidden" id="recipe-id">
                
                <div class="form-group">
                    <label for="recipe-title">שם המתכון</label>
                    <input type="text" id="recipe-title" required placeholder="לדוגמה: עוגת שוקולד חמה">
                </div>

                <div class="form-group">
                    <label for="recipe-category">סוג (קטגוריה)</label>
                    <input type="text" id="recipe-category" required list="category-options" placeholder="לדוגמה: קינוח, אפייה, מנה עיקרית...">
                    <datalist id="category-options">
                        <option value="אפייה"></option>
                        <option value="קינוח"></option>
                        <option value="מנה עיקרית"></option>
                        <option value="מנה ראשונה"></option>
                        <option value="בישול"></option>
                        <option value="תוספת"></option>
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="recipe-difficulty">דרגת קושי</label>
                    <select id="recipe-difficulty" required>
                        <option value="קל">קל</option>
                        <option value="בינוני">בינוני</option>
                        <option value="קשה">קשה</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="recipe-content">רכיבים והוראות / קישור למתכון</label>
                    <textarea id="recipe-content" rows="5" required placeholder="הזן קישור (https/http) או פרט את הרכיבים והוראות ההכנה..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-outline" id="cancel-modal">ביטול</button>
                    <button type="submit" class="btn btn-primary">שמירה</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Read Full Recipe Modal -->
    <div class="modal-backdrop" id="view-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 id="view-modal-title"></h3>
                <button class="close-btn" id="close-view-modal">&times;</button>
            </div>
            <div id="view-modal-badges" class="badges-group" style="margin-bottom: 0.75rem;"></div>
            <div class="view-modal-content" id="view-modal-body"></div>
            <div class="form-actions">
                <button type="button" class="btn btn-primary" id="close-view-btn">סגור</button>
            </div>
        </div>
    </div>

            { "id": "51", "title": "עוגת שוקולד לילדים לגן", "category": "אפייה", "difficulty": "קל", "linkOrInstructions": "רכיבים:\n2-3 ביצים, 1 כוס סוכר, 1 כוס שמן, 1 כוס מים פושרים, 3/4 כוס מים חמים, 2 כוסות קמח, 1 שקית אבקת אפייה, 1/2 כוס קקאו.\n\nהוראות:\nמערבבים את כל המרכיבים לפי הסדר, יוצקים לתבנית ואופים ב-175 מעלות כ-35 דקות.", "favorite": false },
            { "id": "52", "title": "עלי גפן וגמבות ממולאים בעוף טחון ואורז", "category": "בישול", "difficulty": "קשה", "linkOrInstructions": "רכיבים:\nעלי גפן, גמבות, בצלים, 1 ק\"ג עוף טחון, 2 כוסות אורז עגול, עשבי תיבול, שמן זית, תבלינים.\nרוטב: מיץ לימון, מים, מלח, מעט שמן זית.\n\nהוראות:\nממלאים את הירקות ועלי הגפן, מסדרים בצפוף בסיר, יוצקים את הרוטב ומבשלים שעתיים על אש קטנה.", "favorite": false },
            { "id": "53", "title": "לחם שיפון וחיטה לבנה", "category": "אפייה", "difficulty": "בינוני", "linkOrInstructions": "רכיבים:\n290 מ\"ל מים, 3 כפות שמן זית, 1 כפית חומץ, 1 כפית מלח, 200ג קמח שיפון מלא, 250ג קמח חיטה לבן, 2 כפיות שמרים יבשים.\n\nהוראות:\nלשים את כל החומרים, מתפיחים שעה, מעצבים כיכר, מתפיחים שוב 40 דקות ואופים ב-200 מעלות כ-35 דקות.", "favorite": false },
            { "id": "54", "title": "ניוקי תפוחי אדמה ביתי", "category": "מנה עיקרית", "difficulty": "בינוני", "linkOrInstructions": "https://www.hashulchan.co.il/%D7%9E%D7%AA%D7%A7%D7%95%D7%A0%D7%99%D7%9D/%D7%A0%D7%99%D7%95%D7%A7%D7%99/", "favorite": false }
        ];

        // State
        let recipes = [];
        let currentCategory = 'all'; // 'all', 'favs', or specific category name
        let searchQuery = '';

        // DOM Elements
        const gridEl = document.getElementById('recipes-grid');
        const searchInput = document.getElementById('search-input');
        const filterContainer = document.getElementById('filter-container');
        const statsCounter = document.getElementById('stats-counter');
        const homeBtn = document.getElementById('home-btn');
        const logoBtn = document.getElementById('logo-btn');
        const addRecipeBtn = document.getElementById('add-recipe-btn');
        
        // Add/Edit Modal Elements
        const modal = document.getElementById('recipe-modal');
        const modalTitle = document.getElementById('modal-title');
        const closeModalBtn = document.getElementById('close-modal');
        const cancelModalBtn = document.getElementById('cancel-modal');
        const recipeForm = document.getElementById('recipe-form');
        const recipeIdInput = document.getElementById('recipe-id');
        const recipeTitleInput = document.getElementById('recipe-title');
        const recipeCategoryInput = document.getElementById('recipe-category');
        const recipeDifficultyInput = document.getElementById('recipe-difficulty');
        const recipeContentInput = document.getElementById('recipe-content');

        // View Recipe Modal Elements
        const viewModal = document.getElementById('view-modal');
        const viewModalTitle = document.getElementById('view-modal-title');
        const viewModalBadges = document.getElementById('view-modal-badges');
        const viewModalBody = document.getElementById('view-modal-body');
        const closeViewModalBtn = document.getElementById('close-view-modal');
        const closeViewBtn = document.getElementById('close-view-btn');

        // Init App
        function init() {
            loadRecipes();
            renderCategoryFilters();
            setupEventListeners();
            render();
        }

        // LocalStorage Management
        function loadRecipes() {
            const stored = localStorage.getItem('my_recipes_data_v2');
            if (stored) {
                try {
                    recipes = JSON.parse(stored);
                } catch (e) {
                    recipes = initialRecipes;
                }
            } else {
                recipes = initialRecipes;
                saveRecipes();
            }
        }

        function saveRecipes() {
            localStorage.setItem('my_recipes_data_v2', JSON.stringify(recipes));
        }

        // Utility: Check if text is URL
        function isURL(str) {
            return str.trim().startsWith('http://') || str.trim().startsWith('https://');
        }

        // Dynamic Category Filter Buttons
        function renderCategoryFilters() {
            const categories = [...new Set(recipes.map(r => r.category))].filter(Boolean);
            
            filterContainer.innerHTML = `
                <button class="btn btn-outline ${currentCategory === 'all' ? 'active' : ''}" data-category="all">הצג הכל</button>
                <button class="btn btn-outline ${currentCategory === 'favs' ? 'active' : ''}" data-category="favs">❤️ מועדפים</button>
            `;

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `btn btn-outline ${currentCategory === cat ? 'active' : ''}`;
                btn.dataset.category = cat;
                btn.textContent = cat;
                filterContainer.appendChild(btn);
            });
        }

        // Render Cards Grid
        function render() {
            gridEl.innerHTML = '';

            const filtered = recipes.filter(recipe => {
                let matchesCategory = true;
                if (currentCategory === 'favs') {
                    matchesCategory = recipe.favorite;
                } else if (currentCategory !== 'all') {
                    matchesCategory = recipe.category === currentCategory;
                }

                const query = searchQuery.toLowerCase().trim();
                const matchesSearch = recipe.title.toLowerCase().includes(query) || 
                                      recipe.category.toLowerCase().includes(query) ||
                                      recipe.linkOrInstructions.toLowerCase().includes(query);

                return matchesCategory && matchesSearch;
            });

            // Update counter
            statsCounter.textContent = `מציג ${filtered.length} מתכונים מתוך ${recipes.length}`;

            if (filtered.length === 0) {
                gridEl.innerHTML = `
                    <div class="empty-state">
                        <h3>לא נמצאו מתכונים</h3>
                        <p>נסה לשנות את מונחי החיפוש או הוסיף מתכון חדש.</p>
                    </div>
                `;
                return;
            }

            filtered.forEach(recipe => {
                const card = document.createElement('article');
                card.className = 'card';

                const isLink = isURL(recipe.linkOrInstructions);
                
                let bodyHtml = '';
                if (isLink) {
                    bodyHtml = `<a href="${recipe.linkOrInstructions}" target="_blank" class="btn btn-primary link-btn">🔗 לצפייה במתכון המלא</a>`;
                } else {
                    bodyHtml = `
                        <div class="instructions-text">${recipe.linkOrInstructions}</div>
                        <button class="view-more-btn" onclick="openViewModal('${recipe.id}')">📖 קרא את המתכון המלא...</button>
                    `;
                }

                card.innerHTML = `
                    <div>
                        <div class="card-header">
                            <div class="badges-group">
                                <span class="badge badge-category">${recipe.category}</span>
                                <span class="badge badge-diff-${recipe.difficulty}">${recipe.difficulty}</span>
                            </div>
                            <button class="fav-btn" onclick="toggleFavorite('${recipe.id}')" title="מועדפים">
                                ${recipe.favorite ? '❤️' : '🤍'}
                            </button>
                        </div>
                        <h2 class="card-title">${recipe.title}</h2>
                        <div class="card-body">
                            ${bodyHtml}
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-outline" onclick="openEditModal('${recipe.id}')">✏️ עריכה</button>
                        <button class="btn btn-danger-outline" onclick="deleteRecipe('${recipe.id}')">🗑️ מחיקה</button>
                    </div>
                `;

                gridEl.appendChild(card);
            });
        }

        // Setup Listeners
        function setupEventListeners() {
            searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value;
                render();
            });

            filterContainer.addEventListener('click', (e) => {
                const target = e.target.closest('button');
                if (!target || !target.dataset.category) return;

                currentCategory = target.dataset.category;
                
                document.querySelectorAll('#filter-container .btn').forEach(btn => btn.classList.remove('active'));
                target.classList.add('active');
                
                render();
            });

            const resetHome = () => {
                searchQuery = '';
                searchInput.value = '';
                currentCategory = 'all';
                renderCategoryFilters();
                render();
            };

            homeBtn.addEventListener('click', resetHome);
            logoBtn.addEventListener('click', resetHome);

            addRecipeBtn.addEventListener('click', openAddModal);
            closeModalBtn.addEventListener('click', closeModal);
            cancelModalBtn.addEventListener('click', closeModal);
            
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });

            closeViewModalBtn.addEventListener('click', closeViewModal);
            closeViewBtn.addEventListener('click', closeViewModal);
            viewModal.addEventListener('click', (e) => {
                if (e.target === viewModal) closeViewModal();
            });

            recipeForm.addEventListener('submit', handleFormSubmit);
        }

        // Actions
        function toggleFavorite(id) {
            recipes = recipes.map(r => r.id === id ? { ...r, favorite: !r.favorite } : r);
            saveRecipes();
            render();
        }

        function deleteRecipe(id) {
            if (confirm('האם אתה בטוח שברצונך למחוק מתכון זה?')) {
                recipes = recipes.filter(r => r.id !== id);
                saveRecipes();
                renderCategoryFilters();
                render();
            }
        }

        function openAddModal() {
            recipeForm.reset();
            recipeIdInput.value = '';
            modalTitle.textContent = 'הוספת מתכון חדש';
            modal.classList.add('active');
        }

        function openEditModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            recipeIdInput.value = recipe.id;
            recipeTitleInput.value = recipe.title;
            recipeCategoryInput.value = recipe.category;
            recipeDifficultyInput.value = recipe.difficulty;
            recipeContentInput.value = recipe.linkOrInstructions;

            modalTitle.textContent = 'עריכת מתכון';
            modal.classList.add('active');
        }

        function closeModal() {
            modal.classList.remove('active');
        }

        function openViewModal(id) {
            const recipe = recipes.find(r => r.id === id);
            if (!recipe) return;

            viewModalTitle.textContent = recipe.title;
            viewModalBadges.innerHTML = `
                <span class="badge badge-category">${recipe.category}</span>
                <span class="badge badge-diff-${recipe.difficulty}">דרגת קושי: ${recipe.difficulty}</span>
            `;
            viewModalBody.textContent = recipe.linkOrInstructions;
            viewModal.classList.add('active');
        }

        function closeViewModal() {
            viewModal.classList.remove('active');
        }

        function handleFormSubmit(e) {
            e.preventDefault();

            const id = recipeIdInput.value;
            const newRecipeData = {
                title: recipeTitleInput.value.trim(),
                category: recipeCategoryInput.value.trim(),
                difficulty: recipeDifficultyInput.value,
                linkOrInstructions: recipeContentInput.value.trim(),
            };

            if (id) {
                recipes = recipes.map(r => r.id === id ? { ...r, ...newRecipeData } : r);
            } else {
                const newRecipe = {
                    id: Date.now().toString(),
                    ...newRecipeData,
                    favorite: false
                };
                recipes.unshift(newRecipe);
            }

            saveRecipes();
            closeModal();
            renderCategoryFilters();
            render();
        }

        // Start
        init();
    </script>
</body>
</html>

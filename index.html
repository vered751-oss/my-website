<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ספר המתכונים שלי</title>
  <style>
    :root {
      --bg-color: #f0f9ff;
      --card-bg: #ffffff;
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    header {
      background-color: var(--card-bg);
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 1rem 1.5rem;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }

    .nav-actions {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: var(--radius);
      padding: 0.6rem 1.2rem;
      font-size: 0.95rem;
      font-weight: 600;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #e0f2fe;
      color: var(--primary-hover);
    }

    .btn-secondary:hover {
      background-color: #bae6fd;
    }

    .btn-secondary.active {
      background-color: var(--primary);
      color: white;
    }

    .btn-danger {
      background-color: #fee2e2;
      color: #dc2626;
    }

    .btn-danger:hover {
      background-color: #fecaca;
    }

    .container {
      max-width: 1200px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .toolbar {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 1.2rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    @media (min-width: 640px) {
      .toolbar {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
      }
    }

    .search-box {
      flex: 1;
      max-width: 500px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box input:focus {
      border-color: var(--primary);
    }

    .filter-buttons {
      display: flex;
      gap: 0.5rem;
    }

    .recipes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      border: 1px solid var(--border);
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }

    .card-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
    }

    .fav-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }

    .tags {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 0.8rem;
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
    }

    .tag-category {
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .tag-difficulty {
      background-color: #f1f5f9;
      color: #475569;
    }

    .card-content {
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.5;
      flex-grow: 1;
    }

    .recipe-link {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: #f0f9ff;
      color: var(--primary);
      border: 1px solid var(--primary);
      padding: 0.6rem;
      border-radius: var(--radius);
      text-decoration: none;
      font-weight: 600;
      transition: all 0.2s;
    }

    .recipe-link:hover {
      background-color: var(--primary);
      color: white;
    }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 1rem;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: var(--radius);
      width: 100%;
      max-width: 500px;
      box-shadow: var(--shadow-lg);
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      color: var(--text-main);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.6rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-size: 0.95rem;
      outline: none;
    }

    .form-group textarea {
      resize: vertical;
      min-height: 80px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
      margin-top: 1.5rem;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      padding: 3rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="logo" id="logoBtn">📖 ספר המתכונים שלי</div>
      <div class="nav-actions">
        <button class="btn-secondary" id="homeBtn">🏠 דף הבית</button>
        <button class="btn-primary" id="addBtn">➕ מתכון חדש</button>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="toolbar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="חפש לפי שם מתכון או קטגוריה...">
      </div>
      <div class="filter-buttons">
        <button class="btn-secondary active" id="filterAll">הצג הכל</button>
        <button class="btn-secondary" id="filterFav">❤️ מועדפים</button>
      </div>
    </section>

    <section class="recipes-grid" id="recipesGrid"></section>
  </main>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <h2 class="modal-title" id="modalTitle">הוספת מתכון חדש</h2>
      <form id="recipeForm">
        <input type="hidden" id="recipeId">
        <div class="form-group">
          <label for="title">שם המתכון</label>
          <input type="text" id="title" required>
        </div>
        <div class="form-group">
          <label for="category">קטגוריה</label>
          <input type="text" id="category" placeholder="לדוגמה: קינוח, אפייה, מנה עיקרית" required>
        </div>
        <div class="form-group">
          <label for="difficulty">דרגת קושי</label>
          <select id="difficulty" required>
            <option value="קל">קל</option>
            <option value="בינוני">בינוני</option>
            <option value="קשה">קשה</option>
          </select>
        </div>
        <div class="form-group">
          <label for="linkOrInstructions">קישור למתכון או רכיבים והוראות</label>
          <textarea id="linkOrInstructions" placeholder="הכנס קישור URL (מתחיל ב-http) או טקסט חופשי..." required></textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="cancelBtn">ביטול</button>
          <button type="submit" class="btn-primary">שמירה</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const defaultRecipes = [
      {"id": "1", "title": "אוזני המן קלאסיות במילוי נוטלה", "category": "קינוח", "difficulty": "בינוני", "linkOrInstructions": "https://foody.co.il/foody_recipe/%d7%90%d7%95%d7%96%d7%a0%d7%99-%d7%94%d7%9e%d7%9f-%d7%a7%d7%9c%d7%a1%d7%99%d7%95%d7%aa-%d7%91%d7%9e%d7%99%d7%9c%d7%95%d7%99-%d7%a0%d7%95%d7%98%d7%9c%d7%94/", "favorite": false},
      {"id": "2", "title": "פררו רושה ביתי", "category": "קינוח", "difficulty": "קל", "linkOrInstructions": "https://www.mako.co.il/food-cooking_magazine/SOS/Recipe-bd7cfae0b015f61026.htm", "favorite": false},
      {"id": "3", "title": "ממתק שוקולד ופקאן", "category": "קינוח", "difficulty": "קל", "linkOrInstructions": "https://www.10dakot.co.il/recipe/%D7%9E%D7%9E%D7%AA%D7%A7-%D7%A9%D7%95%D7%A7%D7%95%D7%9C%D7%93-%D7%95%D7%A4%D7%A7%D7%90%D7%9F/", "favorite": false},
      {"id": "4", "title": "בואיקוס (לחמניות גבינה)", "category": "אפייה", "difficulty": "קל", "linkOrInstructions": "https://www.hashulchan.co.il/%D7%9E%D7%AA%D7%A7%D7%95%D7%A0%D7%99%D7%9D/%D7%91%D7%95%D7%90%D7%99%D7%A7%D7%95%D7%A1/", "favorite": false},
      {"id": "5", "title": "פיש אנד צ'יפס דניס", "category": "מנה עיקרית", "difficulty": "בינוני", "linkOrInstructions": "https://www.hashulchan.co.il/%D7%9E%D7%AA%D7%A7%D7%95%D7%A0%D7%99%D7%9D/%D7%A4%D7%99%D7%A9-%D7%A6%D7%99%D7%A4%D7%A1/", "favorite": false}
    ];

    let recipes = [];
    let activeFilter = 'all';
    let searchQuery = '';

    const recipesGrid = document.getElementById('recipesGrid');
    const searchInput = document.getElementById('searchInput');
    const filterAllBtn = document.getElementById('filterAll');
    const filterFavBtn = document.getElementById('filterFav');
    const homeBtn = document.getElementById('homeBtn');
    const logoBtn = document.getElementById('logoBtn');
    const addBtn = document.getElementById('addBtn');
    const modalOverlay = document.getElementById('modalOverlay');
    const cancelBtn = document.getElementById('cancelBtn');
    const recipeForm = document.getElementById('recipeForm');
    const modalTitle = document.getElementById('modalTitle');

    function init() {
      const stored = localStorage.getItem('my_recipes');
      if (stored) {
        try {
          recipes = JSON.parse(stored);
        } catch (e) {
          recipes = defaultRecipes;
        }
      } else {
        recipes = defaultRecipes;
        saveToLocalStorage();
      }
      render();
    }

    function saveToLocalStorage() {
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
    }

    function resetView() {
      searchQuery = '';
      searchInput.value = '';
      activeFilter = 'all';
      updateFilterButtons();
      render();
    }

    function updateFilterButtons() {
      if (activeFilter === 'all') {
        filterAllBtn.classList.add('active');
        filterFavBtn.classList.remove('active');
      } else {
        filterFavBtn.classList.add('active');
        filterAllBtn.classList.remove('active');
      }
    }

    function render() {
      recipesGrid.innerHTML = '';

      const filtered = recipes.filter(r => {
        const matchesFilter = activeFilter === 'fav' ? r.favorite : true;
        const matchesSearch = r.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                              r.category.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesFilter && matchesSearch;
      });

      if (filtered.length === 0) {
        recipesGrid.innerHTML = `<div class="empty-state">לא נמצאו מתכונים מתאימים.</div>`;
        return;
      }

      filtered.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'card';

        const isUrl = recipe.linkOrInstructions.trim().startsWith('http://') || 
                      recipe.linkOrInstructions.trim().startsWith('https://');

        const contentHtml = isUrl 
          ? `<a href="${recipe.linkOrInstructions}" target="_blank" class="recipe-link">🔗 לצפייה במתכון המלא</a>`
          : `<div class="card-content">${recipe.linkOrInstructions.replace(/\n/g, '<br>')}</div>`;

        card.innerHTML = `
          <div>
            <div class="card-header">
              <h3 class="card-title">${recipe.title}</h3>
              <button class="fav-btn" onclick="toggleFavorite('${recipe.id}')">
                ${recipe.favorite ? '❤️' : '🤍'}
              </button>
            </div>
            <div class="tags">
              <span class="tag tag-category">${recipe.category}</span>
              <span class="tag tag-difficulty">רמה: ${recipe.difficulty}</span>
            </div>
            ${contentHtml}
          </div>
          <div class="card-actions">
            <button class="btn-secondary" onclick="openEditModal('${recipe.id}')">✏️ עריכה</button>
            <button class="btn-danger" onclick="deleteRecipe('${recipe.id}')">🗑️ מחיקה</button>
          </div>
        `;
        recipesGrid.appendChild(card);
      });
    }

    function toggleFavorite(id) {
      recipes = recipes.map(r => r.id === id ? { ...r, favorite: !r.favorite } : r);
      saveToLocalStorage();
      render();
    }

    function deleteRecipe(id) {
      if (confirm('האם אתה בטוח שברצונך למחוק מתכון זה?')) {
        recipes = recipes.filter(r => r.id !== id);
        saveToLocalStorage();
        render();
      }
    }

    function openAddModal() {
      modalTitle.innerText = 'הוספת מתכון חדש';
      document.getElementById('recipeId').value = '';
      recipeForm.reset();
      modalOverlay.classList.add('active');
    }

    function openEditModal(id) {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;

      modalTitle.innerText = 'עריכת מתכון';
      document.getElementById('recipeId').value = recipe.id;
      document.getElementById('title').value = recipe.title;
      document.getElementById('category').value = recipe.category;
      document.getElementById('difficulty').value = recipe.difficulty;
      document.getElementById('linkOrInstructions').value = recipe.linkOrInstructions;

      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
    }

    recipeForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('recipeId').value;
      const title = document.getElementById('title').value.trim();
      const category = document.getElementById('category').value.trim();
      const difficulty = document.getElementById('difficulty').value;
      const linkOrInstructions = document.getElementById('linkOrInstructions').value.trim();

      if (id) {
        recipes = recipes.map(r => r.id === id ? { ...r, title, category, difficulty, linkOrInstructions } : r);
      } else {
        const newRecipe = {
          id: Date.now().toString(),
          title,
          category,
          difficulty,
          linkOrInstructions,
          favorite: false
        };
        recipes.unshift(newRecipe);
      }

      saveToLocalStorage();
      closeModal();
      render();
    });

    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    filterAllBtn.addEventListener('click', () => {
      activeFilter = 'all';
      updateFilterButtons();
      render();
    });

    filterFavBtn.addEventListener('click', () => {
      activeFilter = 'fav';
      updateFilterButtons();
      render();
    });

    homeBtn.addEventListener('click', resetView);
    logoBtn.addEventListener('click', resetView);
    addBtn.addEventListener('click', openAddModal);
    cancelBtn.addEventListener('click', closeModal);

    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    init();
  </script>
</body>
</html>

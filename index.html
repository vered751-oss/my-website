<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ספר המתכונים שלי</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    form {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="url"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #219150;
    }
    .btn-cancel {
      background-color: #95a5a6;
      display: none;
    }
    .btn-cancel:hover {
      background-color: #7f8c8d;
    }
    .recipe-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .recipe-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    .btn-edit {
      background-color: #f39c12;
    }
    .btn-edit:hover {
      background-color: #d68910;
    }
    .btn-delete {
      background-color: #e74c3c;
    }
    .btn-delete:hover {
      background-color: #c0392b;
    }
    ul, ol {
      padding-right: 20px;
    }
  </style>
</head>
<body>

  <h1>ספר המתכונים שלי</h1>

  <!-- טופס הוספה/עריכה -->
  <form id="recipeForm">
    <input type="hidden" id="recipeId">
    
    <div class="form-group">
      <label for="title">שם המתכון:</label>
      <input type="text" id="title" required placeholder="למשל: עוגת שוקולד">
    </div>

    <div class="form-group">
      <label for="link">קישור למקור (אופציונלי):</label>
      <input type="url" id="link" placeholder="https://example.com">
    </div>

    <div class="form-group">
      <label for="ingredients">מצרכים (כל מצרך בשורה חדשה):</label>
      <textarea id="ingredients" rows="4" placeholder="1 כוס קמח&#10;1/2 כוס סוכר&#10;2 ביצים"></textarea>
    </div>

    <div class="form-group">
      <label for="instructions">הוראות הכנה (כל שלב בשורה חדשה):</label>
      <textarea id="instructions" rows="4" placeholder="לערבב את החומרים בקערה&#10;לאפות ב-180 מעלות כ-30 דקות"></textarea>
    </div>

    <button type="submit" id="submitBtn">שמור מתכון</button>
    <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">ביטול עריכה</button>
  </form>

  <h2>המתכונים שנשמרו</h2>
  <div id="recipesContainer"></div>

  <script>
    // טעינת מתכונים מ-localStorage
    let recipes = JSON.parse(localStorage.getItem('my_recipes')) || [];

    const form = document.getElementById('recipeForm');
    const recipesContainer = document.getElementById('recipesContainer');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    // הוספה או עדכון מתכון
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const id = document.getElementById('recipeId').value;
      const title = document.getElementById('title').value;
      const link = document.getElementById('link').value;
      const ingredients = document.getElementById('ingredients').value.split('\n').filter(i => i.trim() !== '');
      const instructions = document.getElementById('instructions').value.split('\n').filter(i => i.trim() !== '');

      if (id) {
        // עריכת מתכון קיים
        const index = recipes.findIndex(r => r.id == id);
        if (index !== -1) {
          recipes[index] = { id: Number(id), title, link, ingredients, instructions };
        }
      } else {
        // הוספת מתכון חדש
        const newRecipe = {
          id: Date.now(),
          title,
          link,
          ingredients,
          instructions
        };
        recipes.push(newRecipe);
      }

      saveAndRender();
      resetForm();
    });

    // שמירה ב-localStorage והצגה
    function saveAndRender() {
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
      renderRecipes();
    }

    // רנדור המתכונים למסך
    function renderRecipes() {
      recipesContainer.innerHTML = '';

      if (recipes.length === 0) {
        recipesContainer.innerHTML = '<p style="text-align:center;">אין מתכונים שמורים עדיין.</p>';
        return;
      }

      recipes.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'recipe-card';

        let linkHtml = recipe.link ? `<p><a href="${recipe.link}" target="_blank">קישור למתכון המקורי</a></p>` : '';
        
        let ingredientsHtml = recipe.ingredients.length > 0 
          ? `<strong>מצרכים:</strong><ul>${recipe.ingredients.map(item => `<li>${item}</li>`).join('')}</ul>` 
          : '';

        let instructionsHtml = recipe.instructions.length > 0 
          ? `<strong>הוראות הכנה:</strong><ol>${recipe.instructions.map(step => `<li>${step}</li>`).join('')}</ol>` 
          : '';

        card.innerHTML = `
          <h3>${recipe.title}</h3>
          ${linkHtml}
          ${ingredientsHtml}
          ${instructionsHtml}
          <div class="recipe-actions">
            <button class="btn-edit" onclick="editRecipe(${recipe.id})">ערוך</button>
            <button class="btn-delete" onclick="deleteRecipe(${recipe.id})">מחק</button>
          </div>
        `;

        recipesContainer.appendChild(card);
      });
    }

    // טעינת נתונים לטופס לצורך עריכה
    function editRecipe(id) {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;

      document.getElementById('recipeId').value = recipe.id;
      document.getElementById('title').value = recipe.title;
      document.getElementById('link').value = recipe.link || '';
      document.getElementById('ingredients').value = recipe.ingredients.join('\n');
      document.getElementById('instructions').value = recipe.instructions.join('\n');

      submitBtn.textContent = 'עדכן מתכון';
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // מחיקת מתכון
    function deleteRecipe(id) {
      if (confirm('האם אתה בטוח שברצונך למחוק מתכון זה?')) {
        recipes = recipes.filter(r => r.id !== id);
        saveAndRender();
      }
    }

    // איפוס הטופס
    function resetForm() {
      form.reset();
      document.getElementById('recipeId').value = '';
      submitBtn.textContent = 'שמור מתכון';
      cancelBtn.style.display = 'none';
    }

    // הרצה הראשונית בטעינת העמוד
    renderRecipes();
  </script>

</body>
</html>

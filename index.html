<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ספר המתכונים שלי</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
      background-color: #f9f9f9;
      color: #333;
    }
    h1, h2 {
      text-align: center;
      color: #2c3e50;
    }
    form, .search-container {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 25px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    .form-row {
      display: flex;
      gap: 15px;
    }
    .form-row .form-group {
      flex: 1;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    input[type="text"], input[type="url"], select, textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
    }
    button:hover {
      background-color: #219150;
    }
    .btn-cancel {
      background-color: #95a5a6;
      display: none;
    }
    .btn-cancel:hover {
      background-color: #7f8c8d;
    }
    .recipe-card {
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      margin-left: 5px;
      background-color: #e0e0e0;
      color: #333;
    }
    .recipe-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    .btn-edit {
      background-color: #f39c12;
    }
    .btn-edit:hover {
      background-color: #d68910;
    }
    .btn-delete {
      background-color: #e74c3c;
    }
    .btn-delete:hover {
      background-color: #c0392b;
    }
    ul, ol {
      padding-right: 20px;
    }
  </style>
</head>
<body>

  <h1>ספר המתכונים שלי</h1>

  <!-- טופס הוספה/עריכה -->
  <form id="recipeForm">
    <input type="hidden" id="recipeId">
    
    <div class="form-group">
      <label for="title">שם המתכון:</label>
      <input type="text" id="title" required placeholder="למשל: עוגת שוקולד">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="category">סוג מנה:</label>
        <input type="text" id="category" placeholder="למשל: קינוח, מנה עיקרית, אפייה">
      </div>
      <div class="form-group">
        <label for="difficulty">דרגת קושי:</label>
        <select id="difficulty">
          <option value="">בחר/י קושי</option>
          <option value="קל">קל</option>
          <option value="בינוני">בינוני</option>
          <option value="קשה">קשה</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="link">קישור למקור (אופציונלי):</label>
      <input type="url" id="link" placeholder="https://example.com">
    </div>

    <div class="form-group">
      <label for="ingredients">מצרכים (כל מצרך בשורה חדשה):</label>
      <textarea id="ingredients" rows="4" placeholder="1 כוס קמח&#10;1/2 כוס סוכר&#10;2 ביצים"></textarea>
    </div>

    <div class="form-group">
      <label for="instructions">הוראות הכנה (כל שלב בשורה חדשה):</label>
      <textarea id="instructions" rows="4" placeholder="לערבב את החומרים בקערה&#10;לאפות ב-180 מעלות כ-30 דקות"></textarea>
    </div>

    <button type="submit" id="submitBtn">שמור מתכון</button>
    <button type="button" id="cancelBtn" class="btn-cancel" onclick="resetForm()">ביטול עריכה</button>
  </form>

  <h2>המתכונים שנשמרו (<span id="recipeCount">0</span>)</h2>
  
  <div class="search-container">
    <input type="text" id="searchInput" placeholder="חפש מתכון לפי שם, מצרך או סוג..." oninput="renderRecipes()">
  </div>

  <div id="recipesContainer"></div>

      { id: 50, title: "ממרח כבד עוף", category: "תוספת", difficulty: "קל", link: "", ingredients: ["כבדי עוף", "בצל", "מלח, פלפל", "שמן"], instructions: ["מטגנים בצל עד שקפי, מוסיפים כבדים ומטגנים עד בישול", "מתבלים, טוחנים בבלנדר ומוסיפים מעט נוזלים לפי צורך למרקם חלק"] },

      { id: 53, title: "לחם שיפון וחיטה לבנה", category: "אפייה", difficulty: "בינוני", link: "", ingredients: ["290 מ\"ל מים", "3 כפות שמן זית", "1 כפית חומץ", "1 כפית מלח", "200ג קמח שיפון מלא", "250ג קמח חיטה לבן", "זרעי פשתן/צ'יה/אגוזים", "1.5 כפיות שמרים יבשים"], instructions: ["לשים את כל הרכיבים לבצק", "מתפיחים, מעצבים כיכר ואופים בתנור"] },
      { id: 54, title: "סלט כרוב וגזר באסיאתי", category: "תוספת", difficulty: "קל", link: "https://www.10dakot.co.il/recipe/%d7%a1%d7%9c%d7%9f-%d7%9b%d7%a8%d7%95%d7%91-%d7%95%d7%92%d7%96%d7%a8/", ingredients: [], instructions: [] }
    ];

    // טעינת מתכונים מ-localStorage, ואם אין - טעינת ברירת המחדל
    let recipes = JSON.parse(localStorage.getItem('my_recipes'));
    if (!recipes || recipes.length === 0) {
      recipes = initialRecipes;
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
    }

    const form = document.getElementById('recipeForm');
    const recipesContainer = document.getElementById('recipesContainer');
    const submitBtn = document.getElementById('submitBtn');
    const cancelBtn = document.getElementById('cancelBtn');

    // הוספה או עדכון מתכון
    form.addEventListener('submit', function(e) {
      e.preventDefault();

      const id = document.getElementById('recipeId').value;
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const difficulty = document.getElementById('difficulty').value;
      const link = document.getElementById('link').value.trim();
      const ingredients = document.getElementById('ingredients').value.split('\n').filter(i => i.trim() !== '');
      const instructions = document.getElementById('instructions').value.split('\n').filter(i => i.trim() !== '');

      if (id) {
        // עריכת מתכון קיים
        const index = recipes.findIndex(r => r.id == id);
        if (index !== -1) {
          recipes[index] = { id: Number(id), title, category, difficulty, link, ingredients, instructions };
        }
      } else {
        // הוספת מתכון חדש
        const newRecipe = {
          id: Date.now(),
          title,
          category,
          difficulty,
          link,
          ingredients,
          instructions
        };
        recipes.push(newRecipe);
      }

      saveAndRender();
      resetForm();
    });

    // שמירה ב-localStorage והצגה
    function saveAndRender() {
      localStorage.setItem('my_recipes', JSON.stringify(recipes));
      renderRecipes();
    }

    // רנדור המתכונים למסך כולל חיפוש
    function renderRecipes() {
      recipesContainer.innerHTML = '';
      const filter = document.getElementById('searchInput').value.toLowerCase();

      const filteredRecipes = recipes.filter(r => 
        r.title.toLowerCase().includes(filter) || 
        (r.category && r.category.toLowerCase().includes(filter)) ||
        r.ingredients.some(i => i.toLowerCase().includes(filter))
      );

      document.getElementById('recipeCount').textContent = filteredRecipes.length;

      if (filteredRecipes.length === 0) {
        recipesContainer.innerHTML = '<p style="text-align:center;">לא נמצאו מתכונים מתאימים.</p>';
        return;
      }

      filteredRecipes.forEach(recipe => {
        const card = document.createElement('div');
        card.className = 'recipe-card';

        let badges = '';
        if (recipe.category) badges += `<span class="badge">${recipe.category}</span>`;
        if (recipe.difficulty) badges += `<span class="badge">${recipe.difficulty}</span>`;

        let linkHtml = recipe.link ? `<p><a href="${recipe.link}" target="_blank" rel="noopener noreferrer">קישור למתכון המקורי</a></p>` : '';
        
        let ingredientsHtml = recipe.ingredients && recipe.ingredients.length > 0 
          ? `<strong>מצרכים:</strong><ul>${recipe.ingredients.map(item => `<li>${item}</li>`).join('')}</ul>` 
          : '';

        let instructionsHtml = recipe.instructions && recipe.instructions.length > 0 
          ? `<strong>הוראות הכנה:</strong><ol>${recipe.instructions.map(step => `<li>${step}</li>`).join('')}</ol>` 
          : '';

        card.innerHTML = `
          <h3>${recipe.title} ${badges}</h3>
          ${linkHtml}
          ${ingredientsHtml}
          ${instructionsHtml}
          <div class="recipe-actions">
            <button class="btn-edit" onclick="editRecipe(${recipe.id})">ערוך</button>
            <button class="btn-delete" onclick="deleteRecipe(${recipe.id})">מחק</button>
          </div>
        `;

        recipesContainer.appendChild(card);
      });
    }

    // טעינת נתונים לטופס לצורך עריכה
    function editRecipe(id) {
      const recipe = recipes.find(r => r.id === id);
      if (!recipe) return;

      document.getElementById('recipeId').value = recipe.id;
      document.getElementById('title').value = recipe.title;
      document.getElementById('category').value = recipe.category || '';
      document.getElementById('difficulty').value = recipe.difficulty || '';
      document.getElementById('link').value = recipe.link || '';
      document.getElementById('ingredients').value = recipe.ingredients ? recipe.ingredients.join('\n') : '';
      document.getElementById('instructions').value = recipe.instructions ? recipe.instructions.join('\n') : '';

      submitBtn.textContent = 'עדכן מתכון';
      cancelBtn.style.display = 'inline-block';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // מחיקת מתכון
    function deleteRecipe(id) {
      if (confirm('האם אתה בטוח שברצונך למחוק מתכון זה?')) {
        recipes = recipes.filter(r => r.id !== id);
        saveAndRender();
      }
    }

    // איפוס הטופס
    function resetForm() {
      form.reset();
      document.getElementById('recipeId').value = '';
      submitBtn.textContent = 'שמור מתכון';
      cancelBtn.style.display = 'none';
    }

    // הרצה ראשונית
    renderRecipes();
  </script>
